x-github-runner: &github-runner
  # Host network: the default build network can't resolve DNS on this machine.
  build:
    context: .
    network: host
  restart: unless-stopped
  # Per-repo values come from `--env-file`, so .env is optional.
  env_file:
    - path: .env
      required: false
  tty: true
  stdin_open: true
  runtime: nvidia
  environment:
    RUNNER_SCOPE: ${RUNNER_SCOPE}
    GITHUB_HOST: github.com
    REPO_URL: ${REPO_URL}
    ORG_NAME: ${ORG_NAME}
    ACCESS_TOKEN: ${ACCESS_TOKEN}
    RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-runner}
    RANDOM_RUNNER_SUFFIX: "true"
    LABELS: ${RUNNER_LABELS}
    RUNNER_GROUP: ${RUNNER_GROUP}
    RUNNER_WORKDIR: /tmp/github-runner
    EPHEMERAL: "true"
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
    DISABLE_AUTO_UPDATE: "true"

  volumes:
    - /var/run/docker.sock:/var/run/docker.sock

  # If the runner loses GitHub it exits and the entrypoint tries to deregister.
  # That can hang forever while the container still looks "Up", so we check
  # the listener is actually running and let autoheal restart the container.
  healthcheck:
    test: ["CMD", "pgrep", "-f", "^\\./bin/Runner\\.Listener run"]
    interval: 1m
    timeout: 10s
    retries: 5
    start_period: 3m
  labels:
    autoheal: "true"


services:
  github-runner:
    <<: *github-runner

  # Docker does not restart unhealthy containers on its own.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
