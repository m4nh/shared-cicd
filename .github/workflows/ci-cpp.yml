name: CI - C++

on:
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        description: "Docker Hub username, to pull a private container-image or Dockerfile base image"
        required: false
      DOCKER_PASSWORD:
        description: "Docker Hub password or token, to pull a private container-image or Dockerfile base image"
        required: false
      NEXUS_USERNAME:
        description: "Nexus (Assex) username, exposed to pre-build-command for downloading private packages"
        required: false
      NEXUS_PASSWORD:
        description: "Nexus (Assex) password, exposed to pre-build-command for downloading private packages"
        required: false
      NEXUS_REPOSITORY_URL:
        description: "Nexus (Assex) repository base URL (e.g., https://host/repository/cpplib/), exposed to pre-build-command"
        required: false
    inputs:
      container-image:
        description: "Docker image to run the build and tests in (e.g. a prebuilt build environment, possibly private: it is pulled with DOCKER_USERNAME/DOCKER_PASSWORD). When set, the build and tests run in a container job and the apt and CMake installation steps are skipped: the image provides them. The Dockerfile build is logged in to Docker Hub with the same credentials."
        required: false
        type: string
        default: ""
      pre-build-command:
        description: "Shell command run at the repo root before CMake configure and before the Docker build (e.g. to download private prebuilt dependencies). Receives NEXUS_USERNAME, NEXUS_PASSWORD and NEXUS_REPOSITORY_URL in its environment."
        required: false
        type: string
        default: ""
      runner:
        description: "Runner to use"
        required: false
        type: string
        default: "ubuntu-22.04"
      format-check-enabled:
        description: "Enable code formatting check with clang-format"
        required: false
        type: boolean
        default: true
      tests-enabled:
        description: "Enable CMake build and unit tests"
        required: false
        type: boolean
        default: true
      cmake-build-type:
        description: "CMake build type (Release, Debug, RelWithDebInfo)"
        required: false
        type: string
        default: "Release"
      cmake-extra-args:
        description: "Additional CMake configuration arguments"
        required: false
        type: string
        default: ""
      ctest-args:
        description: "Additional arguments to pass to ctest"
        required: false
        type: string
        default: "--output-on-failure"
      docker-build-enabled:
        description: "Enable Docker build"
        required: false
        type: boolean
        default: true
      docker-dockerfile:
        description: "Path to Dockerfile (e.g., dockerfiles/Dockerfile)"
        required: false
        type: string
        default: "Dockerfile"
      docker-context:
        description: "Docker build context directory"
        required: false
        type: string
        default: "."
      docker-tags:
        description: "Docker image tags (comma or space-separated)"
        required: false
        type: string
        default: "ci:latest"
      docker-build-args:
        description: "Docker build arguments (space-separated, e.g., '--build-arg VERSION=1.0.0')"
        required: false
        type: string
        default: ""
      system-dependencies:
        description: "System dependencies to install (space or newline-separated package list)"
        required: false
        type: string
        default: |
          build-essential wget ca-certificates git pkg-config
          libopencv-dev nlohmann-json3-dev libboost-all-dev libeigen3-dev
          python3-numpy python3-dev libsqlite3-dev
          libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxi-dev
          libunwind-dev libceres-dev libsuitesparse-dev
          libgoogle-glog-dev libgflags-dev libcgal-dev libcgal-qt5-dev libmetis-dev
          libfreeimage-dev libglew-dev libopenimageio-dev openimageio-tools libyaml-cpp-dev

jobs:
  format-check:
    name: Format Check
    runs-on: ${{ inputs.runner }}
    if: inputs.format-check-enabled
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check code formatting
        shell: bash
        run: |
          echo "Checking C++ code formatting..."
          find src includes tests -type f \( -name "*.cpp" -o -name "*.hpp" \) \
            -exec clang-format --dry-run -Werror {} +

  build-and-test:
    name: Build & Test
    runs-on: ${{ inputs.runner }}
    if: inputs.tests-enabled && inputs.container-image == ''
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          # Convert multiline/space-separated list to proper apt-get format
          DEPS="${{ inputs.system-dependencies }}"
          DEPS=$(echo "$DEPS" | tr '\n' ' ' | xargs)
          sudo apt-get install -y --no-install-recommends $DEPS

      - name: Install CMake 3.29.8
        shell: bash
        run: |
          CMAKE_VERSION=3.29.8
          wget -q https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz -O /tmp/cmake.tar.gz
          sudo tar --strip-components=1 -xzf /tmp/cmake.tar.gz -C /usr/local
          rm /tmp/cmake.tar.gz
          cmake --version

      - name: Pre-build command
        if: inputs.pre-build-command != ''
        shell: bash
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_REPOSITORY_URL: ${{ secrets.NEXUS_REPOSITORY_URL }}
        run: ${{ inputs.pre-build-command }}

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ inputs.cmake-build-type }} \
            -DCALIBRY_BUILD_TESTS=ON \
            ${{ inputs.cmake-extra-args }}

      - name: Build
        shell: bash
        run: |
          cmake --build build -j$(nproc)

      - name: Run tests
        shell: bash
        run: |
          ctest --test-dir build ${{ inputs.ctest-args }}

  build-and-test-container:
    name: Build & Test
    runs-on: ${{ inputs.runner }}
    if: inputs.tests-enabled && inputs.container-image != ''
    container:
      image: ${{ inputs.container-image }}
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-build command
        if: inputs.pre-build-command != ''
        shell: bash
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_REPOSITORY_URL: ${{ secrets.NEXUS_REPOSITORY_URL }}
        run: ${{ inputs.pre-build-command }}

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ inputs.cmake-build-type }} \
            -DCALIBRY_BUILD_TESTS=ON \
            ${{ inputs.cmake-extra-args }}

      - name: Build
        shell: bash
        run: |
          cmake --build build -j$(nproc)

      - name: Run tests
        shell: bash
        run: |
          ctest --test-dir build ${{ inputs.ctest-args }}

  docker-build:
    name: Build Docker Image
    runs-on: ${{ inputs.runner }}
    if: inputs.docker-build-enabled
    steps:
      - uses: actions/checkout@v4

      - name: Pre-build command
        if: inputs.pre-build-command != ''
        shell: bash
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_REPOSITORY_URL: ${{ secrets.NEXUS_REPOSITORY_URL }}
        run: ${{ inputs.pre-build-command }}

      - name: Log in to Docker Hub
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          fi

      - name: Build Docker image
        uses: m4nh/shared-cicd/actions/docker/build-docker-image@main
        with:
          dockerfile: ${{ inputs.docker-dockerfile }}
          context: ${{ inputs.docker-context }}
          tags: ${{ inputs.docker-tags }}
          build-args: ${{ inputs.docker-build-args }}
